<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#173a31"><title>天使カエル・レース Prototype v0.7</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<canvas id="game" width="1280" height="720"></canvas>
<div id="topHud"><b>ANGEL FROG RACE</b><span id="who">操作：ミカエル</span><span id="speed">0 km/h</span><span id="lap">LAP 1/1</span><span id="status">ジャンプ3回で最高速！</span></div>
<div id="stick"><i></i></div>
<div id="actions">
  <button id="jump" class="jump">ジャンプ<small>3段階 / 維持</small></button>
  <button id="tongue" class="tongue">舌<small>長押し：アンカー</small></button>
  <button id="skillA">A<small>パンチ</small></button>
  <button id="skillB">B<small>泡弾</small></button>
</div>
<button id="swap">操作交代</button>
<div id="help">左スティック：旋回　ジャンプ×3：最高速滑空　滑空後は約5秒ごとにジャンプで維持　舌：コーナー木を最優先／ライバルにも命中<br>ガブリエル A：水弾（小反動）　B：水レーザー（大反動・壁まで）　※水は旋回したい方向へ反動が出るよう自動で横撃ち</div>
</main><script src="game.js"></script></body></html>
