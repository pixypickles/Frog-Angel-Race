<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#173a31"><title>天使カエル・レース Prototype v0.7</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<canvas id="game" width="1280" height="720"></canvas>
<div id="topHud"><b>ANGEL FROG RACE</b><span id="who">操作：ミカエル</span><span id="speed">0 km/h</span><span id="lap">LAP 1/1</span><span id="status">ジャンプ3回で最高速！</span></div>
<div id="stick"><i></i></div>
<div id="actions">
  <button id="jump" class="jump">ジャンプ<small>3段階 / 維持</small></button>
  <button id="tongue" class="tongue">舌<small>長押し：アンカー</small></button>
  <button id="skillA">A<small>パンチ</small></button>
  <button id="skillB">B<small>泡弾</small></button>
</div>
<button id="swap">操作交代</button>
<div id="help">左スティック：旋回　ジャンプ×3：最高速滑空　滑空後は約5秒ごとにジャンプで維持　舌：コーナー木を最優先／ライバルにも命中<br>ガブリエル A：水弾（小反動）　B：水レーザー（大反動・壁まで）　※水は旋回したい方向へ反動が出るよう自動で横撃ち</div>
</main><script src="game.js">
function drawJaggedGrass(ctx, pts, width=44) {
  if (!pts || pts.length < 2) return;
  ctx.save();
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  ctx.strokeStyle = "#087d35";
  ctx.lineWidth = width * 0.68;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.stroke();

  // Short triangular blades along both sides make the barrier read as tall grass.
  ctx.fillStyle = "#129a43";
  const spacing = 24, blade = 18;
  for (let i=0;i<pts.length-1;i++) {
    const a=pts[i], b=pts[i+1], dx=b.x-a.x, dy=b.y-a.y;
    const len=Math.hypot(dx,dy); if(len<1) continue;
    const nx=-dy/len, ny=dx/len, tx=dx/len, ty=dy/len;
    for(let d=0; d<len; d+=spacing){
      const x=a.x+tx*d, y=a.y+ty*d;
      for(const side of [-1,1]){
        const bx=x+nx*side*(width*.28), by=y+ny*side*(width*.28);
        const tipx=bx+nx*side*blade+tx*((d/spacing|0)%2?5:-5);
        const tipy=by+ny*side*blade+ty*((d/spacing|0)%2?5:-5);
        ctx.beginPath();
        ctx.moveTo(bx-tx*7,by-ty*7);
        ctx.lineTo(tipx,tipy);
        ctx.lineTo(bx+tx*7,by+ty*7);
        ctx.closePath();
        ctx.fill();
      }
    }
  }
  ctx.restore();
}

</script></body></html>
